[project]
name = "lora-inspector"
version = "0.1.0"
description = "Inspect and analyze LoRA safetensors files"
readme = "README.md"
authors = [{ name = "rockerBOO", email = "rockerboo@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.2",
    "pillow>=13.0.0",
    "safetensors>=0.3.3",
    "torch>=2.0",
]

[project.optional-dependencies]
# Extra analysis/plotting scripts (visualize.py, similarity.py, etc.)
analysis = [
    "matplotlib",
    "pandas",
    "scikit-learn",
    "seaborn",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

# No build-system: the scripts are standalone, so uv treats this as a
# virtual project (dependencies only, nothing installed).
